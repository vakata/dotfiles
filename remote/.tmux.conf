# Keep the default remote prefix.
set -g prefix C-b

# Quality of life.
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better terminal capabilities.
set -g default-terminal "tmux-256color"

# Allow OSC 52 / terminal escape sequences to pass through.
set -g set-clipboard on
# set -g allow-passthrough on

# Easier pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind p previous-window
bind n next-window
bind x kill-window
bind c new-window

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Sensible split shortcuts.
bind | split-window -h
bind - split-window -v

# Vim-style copy mode.
bind Escape copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi M-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Minimal status bar.
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"

# Windows.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=colour255,bold"

# Left: hostname makes remote sessions obvious.
set -g status-left " #[bold]#H #[default]│ "
set -g status-left-length 30

# Right: time.
set -g status-right " %H:%M "

# Pane borders.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour245"

# Messages / command prompt.
set -g message-style "bg=default,fg=colour255"
