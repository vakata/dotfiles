set -g prefix C-a
bind C-a send-prefix
unbind C-b

# keyboard shorcuts
bind r source-file ~/.tmux.conf
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n S-Down kill-window
bind -n S-Up new-window
bind & kill-window
bind x kill-pane

bind-key o display-popup -E -w 60% -h 60% '
    result=$(tmux list-sessions -F "#{session_name}" |
        fzf --reverse \
            --print-query \
            --prompt="session > ")

    query=$(printf "%s\n" "$result" | sed -n "1p")
    selected=$(printf "%s\n" "$result" | sed -n "2p")

    target=${selected:-$query}

    [ -n "$target" ] || exit 0

    if tmux has-session -t "=$target" 2>/dev/null; then
        tmux switch-client -t "=$target"
    else
        tmux new-session -d -s "$target"
        tmux switch-client -t "=$target"
    fi
'

# options
set -g history-limit 9999999
set -g status-position top
set -g status-interval 5
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
set -g default-command "zsh"
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set-window-option -g automatic-rename off
set-option -g set-titles on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

bind Escape copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi M-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# bind p paste-buffer
set -g set-clipboard on
set -g allow-passthrough on
bind p run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

# tmux popup
set -g popup-style "bg=#24273a,fg=#cad3f5"
set -g popup-border-style "fg=#5b6078,bg=#24273a"

# Default statusbar color
# set-option -g status-style fg=colour223 # bg=bg1, fg=fg1
# set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1
# set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3
# set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1
# set-option -g pane-active-border-style fg=colour230
# set-option -g pane-border-style fg=colour239
# set -g focus-events on
# set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'
set -s escape-time 0

# pane reset
set-window-option -g pane-border-status off # bottom
set-window-option -g pane-border-format '#{?#{==:#{pane_current_command},ssh}, ● SSH ● , #{pane_current_path} }'

set -g status-left ''
set -g status-right "#{E:@catppuccin_status_session}#[fg=#{@thm_subtext_1}]·#{E:@catppuccin_status_host}"
set -g status 2
set -g 'status-format[1]' ''
set -g popup-style "default"
set -g popup-border-style "default"
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# catppuccin
set -g @catppuccin_flavour 'macchiato' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_window_middle_separator " | "
set -g @catppuccin_window_fill "none"
set -g @catppuccin_window_current_text "#{b:window_name}" # use "#W" for application instead of directory
set -g @catppuccin_window_text "#{b:window_name}" # use "#W" for application instead of directory
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_status_modules_right "session host"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"
set -g @catppuccin_session_icon ""
set -g @catppuccin_host_icon ""
set -g @catppuccin_directory_text "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'

